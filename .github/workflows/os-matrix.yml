name: OS Matrix

# On-demand multi-OS checks for local matrix tooling (os-test-matrix).
on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "contract = CI contract subset; full = unittest discover"
        type: choice
        options:
          - contract
          - full
        default: contract
      runner_os:
        description: "GitHub-hosted runner OS"
        type: choice
        options:
          - windows-latest
          - ubuntu-22.04
          - ubuntu-24.04
        default: windows-latest
      python_version:
        description: "Python version"
        type: choice
        options:
          - "3.12"
          - "3.11"
        default: "3.12"

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.test_mode }} on ${{ inputs.runner_os }} (py${{ inputs.python_version }})
    runs-on: ${{ inputs.runner_os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libpulse0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            build-essential \
            linux-libc-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run contract tests
        if: inputs.test_mode == 'contract'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest tests.test_cross_platform_contract tests.test_paths tests.test_os_compatibility_matrix tests.test_win32_window tests.test_video_recorder -v

      - name: Run full test suite
        if: inputs.test_mode == 'full'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
